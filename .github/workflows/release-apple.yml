name: Release Apple XCFramework

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  apple-binary:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: >-
          rustup target add
          aarch64-apple-ios
          aarch64-apple-ios-sim
          x86_64-apple-ios
          aarch64-apple-darwin
          x86_64-apple-darwin
      - run: scripts/build-apple-xcframework.sh
      - run: scripts/verify-apple-xcframework.sh
      - run: scripts/package-apple-xcframework.sh
      - name: Verify or publish the canonical SwiftPM artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          expected="$(tr -d '[:space:]' < scripts/operon-core-release.checksum)"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            mkdir -p published-artifact
            gh release download "$RELEASE_TAG" \
              --pattern OperonCore.xcframework.zip \
              --dir published-artifact
            actual="$(xcrun swift package compute-checksum published-artifact/OperonCore.xcframework.zip)"
          else
            actual="$(xcrun swift package compute-checksum artifacts/OperonCore.xcframework.zip)"
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "Expected SwiftPM checksum: $expected" >&2
            echo "Actual SwiftPM checksum:   $actual" >&2
            exit 1
          fi
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" artifacts/OperonCore.xcframework.zip --generate-notes
          fi
